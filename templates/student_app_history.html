<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Application History</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <h1>Student Application History</h1><br>
            <h5>Student Name:{{student.name}}</h5><br>
            <h5>Department Name:{{student.department}}</h5><br>
            <div>
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Drive No.</th>
                            <th scope="col">Job Title</th>
                            <th scope="col">Results</th>


                        </tr>
                    </thead>
                    <tbody>
                        {% for app in student.applications %}
                        {% if app.drive.company.is_blaclisted == false %}
                        <tr>
                            <th scope="row">{{loop.index}}</th>
                            <td>{{app.drive.job_title}}</td>
                            <td>{{app.status}}</td>

                        </tr>
                        {% endif %}
                        {% endfor %}


                    </tbody>
                </table>
            </div>

          <a href="/student/{{ student.id }}"><button>Back</button></a>
        </div>
      

    </div>
    
</body>

</html>
