<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Applictaions</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>


<body>
    <div id="main">
        <div id="canvas">
            <h1>Update Applications for the Drive</h1><br>
            <p>Job Title: {{ drive.job_title }}</p><br>
            <p>Recieved Applications</p>
            <div class="bd-example m-0 border-0">
                <table class="table table-striped">

                    <tbody>
                        {% for app in applications %}
                        {% if app.status == 'Applied' %}
                        <tr>
                            <th scope="row">{{ app.student.name }}</th>
                            <td><a
                                    href="/student_application_company/{{app.student.name}}/{{ app.student.id }}/Drive/{{ app.drive.id }}"><button
                                        type="button" class="btn btn-primary">Review Applications
                                    </button></td></a>

                        </tr>
                        {% endif %}
                        {% endfor %}

                    </tbody>
                </table>
            </div>

            <a href="/company/{{ drive.company.id }}"><button class="btn btn-success">Back</button></a>
        </div>
    </div>


</body>

</html>
