<!DOCTYPE html>
<html lang="en">

<head>
    <title>Update Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div id="main">
        <div id="canvas">
            <h1>Update Profile</h1><br>
            <div class="container mt-5">
                <h2>Update Profile</h2>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="text" class="form-control" value="{{ student.id }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="text" class="form-control" value="{{ student.email }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" value="{{ student.name }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="text" name="password" class="form-control" value="{{ student.password }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" name="department" class="form-control" value="{{ student.department }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Resume Link</label>
                        <input type="text" name="resume_link" class="form-control" value="{{ student.resume_link }}">
                    </div>

                    <button type="submit" class="btn btn-primary">Update</button>

                </form>
            </div>
        </div>
    </div>
</body>

</html>
